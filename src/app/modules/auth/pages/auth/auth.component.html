<div class="min-h-screen flex items-center justify-center p-6 bg-[#1c1f3b]">
	<div class="w-full max-w-md card">
		<!-- Tabs -->
		<div class="flex border-b border-[#3c3f68] mb-8">
			<button
				(click)="setTab('signin')"
				class="flex-1 py-4 text-center transition-colors cursor-pointer"
				[class.text-white]="activeTab() === 'signin'"
				[class.border-b-2]="activeTab() === 'signin'"
				[class.border-blue-500]="activeTab() === 'signin'"
				[class.text-gray-400]="activeTab() !== 'signin'"
			>
				Iniciar
			</button>
			<button
				(click)="setTab('signup')"
				class="flex-1 py-4 text-center transition-colors cursor-pointer"
				[class.text-white]="activeTab() === 'signup'"
				[class.border-b-2]="activeTab() === 'signup'"
				[class.border-blue-500]="activeTab() === 'signup'"
				[class.text-gray-400]="activeTab() !== 'signup'"
			>
				Registrarse
			</button>
		</div>

		<!-- Sign In Form -->
		@if (activeTab() === 'signin') {
			<form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6">
				<div>
					<label class="block text-sm font-medium text-gray-400 mb-2">Correo Electrónico</label>
					<div class="relative">
						<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">email</span>
						<input
							type="email"
							formControlName="email"
							placeholder="admin@example.com"
							class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
						/>
					</div>
				</div>

				<div>
					<label class="block text-sm font-medium text-gray-400 mb-2">Contraseña</label>
					<div class="relative">
						<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">lock</span>
						<input
							type="password"
							formControlName="password"
							placeholder="••••••••"
							class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
						/>
					</div>
				</div>

				<button
					type="submit"
					[disabled]="loginForm.invalid"
					class="w-full btn-primary justify-center py-4 text-lg font-bold disabled:opacity-50 disabled:cursor-not-allowed"
				>
					Iniciar
				</button>
			</form>
		}

		<!-- Sign Up Form -->
		@if (activeTab() === 'signup') {
			<form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-6">
				<div>
					<label class="block text-sm font-medium text-gray-400 mb-2">Nombre Completo</label>
					<div class="relative">
						<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">person</span>
						<input
							type="text"
							formControlName="name"
							placeholder="Juan Pérez"
							class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
						/>
					</div>
				</div>

				<div>
					<label class="block text-sm font-medium text-gray-400 mb-2">Correo Electrónico</label>
					<div class="relative">
						<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">email</span>
						<input
							type="email"
							formControlName="email"
							placeholder="juan@example.com"
							class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
						/>
					</div>
				</div>

				<div>
					<label class="block text-sm font-medium text-gray-400 mb-2">Contraseña</label>
					<div class="relative">
						<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">lock</span>
						<input
							type="password"
							formControlName="password"
							placeholder="••••••••"
							class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
						/>
					</div>
				</div>

				<button
					type="submit"
					[disabled]="registerForm.invalid"
					class="w-full btn-primary justify-center py-4 text-lg font-bold disabled:opacity-50 disabled:cursor-not-allowed"
				>
					Registrarse
				</button>
			</form>
		}
	</div>
</div>
