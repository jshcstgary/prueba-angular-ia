<div class="p-6">
	<div class="flex justify-between items-center mb-6">
		<h1 class="text-3xl font-bold">Opciones</h1>
		<button class="btn-primary">
			<span class="material-icons">add</span>
			Nuevo
		</button>
	</div>

	<div class="card">
		<table>
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Ruta</th>
					<th>Ícono</th>
					<th>Módulo</th>
				</tr>
			</thead>
			<tbody>
				@if (options() === null) {
					<tr>
						<td colspan="4" class="text-center py-10">
							<span class="material-icons spinner">sync</span>
						</td>
					</tr>
				} @else {
					@for (option of options()?.data; track option.id) {
						<tr>
							<td>{{ option.name }}</td>
							<td><code>{{ option.path }}</code></td>
							<td>
								<span class="material-icons">{{ option.icon }}</span>
							</td>
							<td>{{ option.module.name }}</td>
						</tr>
					} @empty {
						<tr>
							<td colspan="4" class="text-center py-10 text-gray-400">Sin registros</td>
						</tr>
					}
				}
			</tbody>
		</table>
	</div>
</div>
