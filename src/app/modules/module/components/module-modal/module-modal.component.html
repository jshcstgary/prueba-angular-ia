<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1c1f3b]/80 backdrop-blur-sm">
	<div class="w-full max-w-lg bg-[#282c4d] rounded-2xl shadow-2xl border border-[#3c3f68] overflow-hidden">
		<!-- Header -->
		<div class="px-6 py-4 border-b border-[#3c3f68] flex justify-between items-center bg-[#1c1f3b]/30">
			<h2 class="text-xl font-bold text-white">{{ module ? "Editar Módulo" : "Nuevo Módulo" }}</h2>
			<button (click)="onClose()" class="text-gray-400 hover:text-white transition-colors">
				<span class="material-icons">close</span>
			</button>
		</div>

		<!-- Body -->
		<form [formGroup]="moduleForm" (ngSubmit)="onSave()" class="p-6 space-y-6">
			<div>
				<label class="block text-sm font-medium text-gray-400 mb-2">Nombre del Módulo</label>
				<input
					type="text"
					formControlName="name"
					placeholder="Ej. Mantenedores"
					class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 transition-colors"
				/>
			</div>

			<div>
				<label class="block text-sm font-medium text-gray-400 mb-2">Descripción</label>
				<textarea
					formControlName="description"
					placeholder="Breve descripción del módulo..."
					rows="3"
					class="w-full bg-[#1c1f3b] border border-[#3c3f68] rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 transition-colors resize-none"
				></textarea>
			</div>

			<div class="flex items-center gap-3">
				<label class="relative inline-flex items-center cursor-pointer">
					<input type="checkbox" formControlName="active" class="sr-only peer" />
					<div
						class="w-11 h-6 bg-[#3c3f68] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"
					></div>
					<span class="ml-3 text-sm font-medium text-gray-400">Activo</span>
				</label>
			</div>

			<!-- Footer -->
			<div class="pt-4 flex gap-3">
				<button type="button" (click)="onClose()" class="flex-1 py-3 px-4 rounded-lg bg-[#3c3f68] text-white hover:bg-[#4d4d80] transition-colors">
					Cancelar
				</button>
				<button
					type="submit"
					[disabled]="moduleForm.invalid"
					class="flex-1 btn-primary justify-center py-3 px-4 disabled:opacity-50 disabled:cursor-not-allowed"
				>
					Guardar
				</button>
			</div>
		</form>
	</div>
</div>
